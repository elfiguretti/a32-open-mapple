# Samsung Galaxy A32 4G (SM-A325M, codename a32).
# SoC layer: kernel/mediatek/mt6768 (MT6769T Helio G80, Mali-G52 MC2 Bifrost, eMMC MSDC0).
# Values verified from SM-A325M live.dtb, gpt.bin, iomem.txt and stock A325MUBSBDYC1 boot.img.
device a32
	title	Samsung Galaxy A32 4G (SM-A325M)
	vendor	samsung
	soc	mt6768
	soc_vendor	mediatek
	machine	MT6768
	boot	lk-chain
	bootimg_version	2
	bootimg_pagesize	2048
	bootimg_base	0x40078000
	bootimg_kernel_offset	0x00008000
	bootimg_ramdisk_offset	0x07c08000
	bootimg_tags_offset	0x0bc08000
	bootimg_dtb_offset	0x0bc08000
	bootimg_os_version	13.0.0
	bootimg_os_patch_level	2025-03
	bootimg_kernel	gz
	bootimg_cmdline	bootopt=64S3,32N2,64N2 loop.max_part=7
	gpu	mali
	defconfig	a32_defconfig
	firmware	pull-firmware.sh
	maintainer	local
	cmdline	mp_touch=0 mp_conlog=1 mp_fb_noconsole=0 emmc_root=1 mp_bootrec_nowrite=1 unentitled_ios_sim_launch=1 ignition_level=1 launchd_unsecure_cache=1 cpus=8 mp_cpufreq=2 mp_gpu=0 mp_wifi_steps=0 mp_bt_steps=0
	adt	--audio
	loader	-DXNU_SHIM=1
	dev_loader	-DROOT_ROOM_MIB=0
	payload_max	0x0e00000
	root_size	16g
	single_cmdline	emmc_root=1
	single_loader	-DXNU_DEFAULT=1
	split_size	22
	split_loader	-DSPLIT_MENU=1
	light_ui	1
	bluetooth	0
	resize	0
	audio	0
	status display wip LK framebuffer confirmed at 0x7c720000 (1080x2400, s6e3fc3 AMOLED DSI CMD, ovl0=0x1400b000, ovl0_2l=0x1400c000, dsi0=0x14014000, mutex=0x14016000); fbdiag pending
	status touch wip STMicroelectronics FTS5CU56A (stm,stm_ts) confirmed live on i2c6 (0x1100d000) @ 0x49, IRQ EINT 10; IOKit driver to be written
	status buttons wip keypad 0x10010000 (bit 1 = Vol Up, SPI 0x49) + MT6358 PMIC pwrap 0x1000d000 (EINT 144, PWRKEY + Vol Down HOMEKEY)
	status cpu wip 6x Cortex-A55 + 2x Cortex-A75 (MT6769T); cpufreq from hakios-mt6768
	status gpu wip Mali-G52 MC2 (Bifrost) @ 0x13040000, mfgcfg 0x13000000, IRQs 274..276; kernel bring-up from hakios-mt6768 + Mesa Panfrost Bifrost path
	status storage wip 128 GB eMMC (SAMSUNG DV6DAB), MSDC0 @ 0x11230000 (SPI 0x64), 512 B blocks, 107.37 GiB userdata; eMMC driver from hakios-mt6768
	status sensors missing SCP @ 0x10500000 (sram 0x80000) + Samsung SHUB; to be verified
	status wifi wip MT6631 @ consys 0x18002000, exact soc1_0_1a_1 firmware confirmed in /vendor/firmware
	status bluetooth wip MT6631 HCI/STP, btif 0x1100c000
	status audio missing mt6768-afe-pcm @ 0x11220000 + MT6358 + sma1305 amp (i2c18 @ 0x1e)
	status battery wip MT6358 fuel gauge (mt6358_gauge.c already in xnu_kernel_mediatek_common); SM5714 external charger
	status haptic missing MT6358 ldo_vibr
	status camera missing s5kgw3/hi2021q/sr846d/gc5035
	status torch missing SM5714 flash LED
	status cellular missing
	status thermal missing therm_ctrl @ 0x1100b000
